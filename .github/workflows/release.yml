# Compila Vissium.exe en un runner de Windows y lo publica como
# GitHub Release cada vez que se sube un tag de versión (v1.2.3).
#
# Flujo de trabajo pensado:
#   1. Desarrollas en la rama `testing`.
#   2. Cuando está listo para publicarse, haces merge de `testing` a
#      `master` (Pull Request o merge directo).
#   3. En `master`, subes `version.py` con el número nuevo si no lo
#      habías hecho ya, y creas+subes un tag con ese mismo número:
#
#        git checkout master
#        git pull
#        git tag v1.2.3
#        git push origin v1.2.3
#
#   4. Este workflow se dispara automáticamente con el tag, compila
#      el .exe y crea el Release con el .exe adjunto. Vissium
#      detectará este Release la próxima vez que compruebe
#      actualizaciones (ver updater.py) porque `releases/latest`
#      siempre apunta al último Release publicado (nunca a un
#      pre-release/borrador), y solo se publican Releases desde
#      `master`.

name: Publicar Release de Vissium

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Vissium.exe
        run: pyinstaller vissium.spec --noconfirm

      - name: Publicar Release con el .exe adjunto
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vissium.exe
          generate_release_notes: true
